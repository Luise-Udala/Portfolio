<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Operações · Demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;--bg1:#ffffff;--bg2:#ffffff;--bg3:#ffffff;--surface:rgba(255,255,255,.94);--surface-solid:#ffffff;
  --ink:#242020;--ink2:#5d5555;--ink3:#8e8585;--line:rgba(36,32,32,.10);--line2:rgba(181,143,0,.28);
  --accent:#ffd932;--accent2:#f2b705;--accent-ink:#242020;--accent-deep:#8a6a00;--accent-soft:#fff1a8;--accent-pale:#fff9dc;--sky:#d9a400;
  --shadow:0 8px 26px rgba(150,110,0,.13);--rail:#ffd932;--pale:#f3ead0;
  --c-and:#ffd932;--c-fin:#e0a000;--c-per:#7a5f00;--c-can:#cfc8c8;
  --warn:#b45309;--bad:#c0392b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:#ffffff;min-height:100vh;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:92px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:16px 10px;position:sticky;top:0;height:100vh;box-shadow:4px 0 22px rgba(150,110,0,.18)}
.rail .brand-logo{width:72px;height:auto;display:block;margin:0 auto 12px;filter:drop-shadow(0 1px 1.5px rgba(120,90,0,.55))}
.nav{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;border:0;background:none;cursor:pointer;color:var(--accent-ink);text-decoration:none;font-size:11.5px;font-weight:600}
.nav svg{width:22px;height:22px}
.nav:hover{background:rgba(255,255,255,.45)}
.nav[aria-current="page"]{background:#fff;box-shadow:0 6px 16px rgba(120,90,0,.22);font-weight:800}
.nav:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
main{padding:22px 28px 40px;max-width:1560px;width:100%;min-width:0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 4px 14px}
.ttl-wrap{display:flex;align-items:center;gap:12px}
.head-logo{height:42px;width:42px;display:block;flex:none}
.head h1{font-size:21px;font-weight:400;margin:0;letter-spacing:-.01em}
.head h1 small{font-size:21px;font-weight:800;color:var(--ink);margin-left:14px}
.pill{font-size:12px;font-weight:600;color:var(--ink2);background:var(--surface);border:1px solid var(--line2);padding:5px 11px;border-radius:99px}
.top{display:grid;grid-template-columns:1fr 330px;gap:18px;margin-bottom:18px}
.glass{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:22px;box-shadow:var(--shadow)}
.period{padding:14px 22px 12px}
.period .lbl{font-size:13px;color:var(--ink2);margin-bottom:8px}
.period .lbl b{color:var(--ink);font-weight:800;margin-left:6px}
.period .lbl i{font-style:normal;color:var(--ink3);margin-left:6px;font-size:12px}
.slider{position:relative;height:26px}
.slider .track{position:absolute;left:10px;right:10px;top:10px;height:6px;border-radius:6px;background:var(--pale)}
.slider .fill{position:absolute;top:10px;height:6px;border-radius:6px;background:var(--accent2)}
.slider input{position:absolute;left:0;width:100%;top:0;height:26px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.slider input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--accent2);cursor:grab;box-shadow:0 2px 6px rgba(120,90,0,.3)}
.slider input::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:#fff;border:4px solid var(--accent2);cursor:grab}
.slider input:focus-visible::-webkit-slider-thumb{outline:3px solid var(--accent-ink);outline-offset:2px}
.slider input::-webkit-slider-runnable-track{background:none}
.ticks{position:relative;height:16px;margin:0 10px}
.ticks span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--ink3)}
.chips{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 16px;flex-wrap:wrap}
.chip{border:0;background:none;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.chip:hover{background:var(--accent-soft)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:800;box-shadow:0 6px 14px rgba(200,150,0,.35)}
.chip:focus-visible,.tog:focus-visible,.seg button:focus-visible,select:focus-visible,input[type=search]:focus-visible,.btn:focus-visible,th button:focus-visible,tr[tabindex]:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
.tog{display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.tog .sw{width:32px;height:19px;border-radius:99px;background:var(--pale);position:relative;transition:background .2s;border:1px solid var(--line2)}
.tog .sw::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--surface-solid);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog[aria-pressed="true"] .sw{background:var(--accent)}
.tog[aria-pressed="true"] .sw::after{transform:translateX(13px);background:#fff}
.note-top{font-size:12.5px;color:var(--ink2);margin:-4px 6px 14px}
.pillwrap{display:inline-flex;align-items:center;gap:6px}
.ib{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--accent-ink);background:var(--accent);color:var(--accent-ink);font:italic 800 14px/1 Georgia,"Times New Roman",serif;cursor:pointer;padding:0;margin-left:8px;vertical-align:middle;transition:background .15s}
.pillwrap .ib{margin-left:0}
.ib:hover{background:#fff}
.ib[aria-expanded="true"]{background:var(--accent-ink);color:var(--accent)}
.ib:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
.infopanel{background:var(--surface-solid);border:1px solid var(--line2);border-left:6px solid var(--accent2);border-radius:14px;padding:16px 20px 14px;margin:0 0 16px;font-size:13.5px;line-height:1.6;box-shadow:var(--shadow);max-width:1000px}
.infopanel h4{margin:0 0 8px;font-size:15px;font-weight:800}
.infopanel p{margin:0 0 9px}.infopanel ul{margin:0 0 9px;padding-left:20px}.infopanel li{margin-bottom:4px}
.infopanel .ipclose{margin-top:4px;padding:6px 14px;font-size:12px}
.evo .infopanel{margin-top:10px}
#snappanel .infopanel,#datapanel .infopanel{margin:0 6px 14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr) 330px;gap:18px}
.heroes{grid-column:1 / 5;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.hlab{font-size:12px;font-weight:700;color:var(--ink3);margin:0 0 7px 4px}
.tile{position:relative;height:196px;border-radius:22px;padding:18px;color:var(--accent-ink);overflow:hidden;cursor:default;box-shadow:var(--shadow);outline:none;transition:transform .25s ease}
.tile:hover,.tile:focus-visible,.tile.open{transform:translateY(-3px) scale(1.02);z-index:5}
.tile:focus-visible{box-shadow:0 0 0 3px var(--accent-ink),var(--shadow)}
.tile .ttl{font-size:14px;font-weight:700}
.tile .sub{font-size:12px;opacity:.75;margin-top:2px}
.tile .big{position:absolute;left:18px;bottom:18px;font-size:30px;font-weight:800;letter-spacing:-.02em;background:rgba(255,255,255,.55);padding:4px 12px;border-radius:12px}
.tile .deco{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.35)}
.tile .deco.b{right:auto;left:-40px;top:auto;bottom:-70px;width:150px;height:150px;background:rgba(255,255,255,.22)}
.t1{background:linear-gradient(145deg,#ffe56e,#ffd932 55%,#f5c400)}
.t2{background:linear-gradient(145deg,#fffbe0,#fff1a8);border:1px solid var(--line2)}
.t3{background:linear-gradient(145deg,#ffd24a,#f5b400 70%,#e5a200)}
.t4{background:var(--surface-solid);border:1px solid var(--line2)}
.t4 .big{background:var(--accent-soft)}.t4 .deco{background:rgba(255,217,50,.30)}.t4 .deco.b{background:rgba(255,217,50,.18)}
.detail{position:absolute;inset:0;padding:16px 18px;background:inherit;opacity:0;pointer-events:none;transition:opacity .2s ease;display:flex;flex-direction:column}
.tile:hover .detail,.tile:focus-visible .detail,.tile.open .detail{opacity:1;pointer-events:auto}
.detail h4{margin:0 0 8px;font-size:13px;font-weight:800}
.detail ol{list-style:none;margin:0;padding:0;flex:1}
.detail li{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(36,32,32,.14)}
.detail li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail li b{font-weight:800;white-space:nowrap}
.detail .foot{font-size:11.5px;opacity:.8;margin-top:6px}
.card{padding:20px 22px}
.card h3{margin:0;font-size:16px;font-weight:800}
.card .sub{font-size:12.5px;color:var(--ink2);margin-top:3px}
.evo{grid-column:1 / 4;grid-row:2 / span 2;min-height:420px;position:relative;display:flex;flex-direction:column}
.bubble{background:var(--accent-soft);color:var(--ink);font-size:12px;font-weight:800;padding:6px 12px;border-radius:99px;white-space:nowrap}
.evo .bubble{position:absolute;right:22px;top:20px}
.legend{display:flex;gap:10px 14px;flex-wrap:wrap;margin:14px 0 4px}
.legend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);background:var(--accent-pale);border:1px solid var(--line2);padding:4px 10px;border-radius:99px}
.legend i{width:10px;height:10px;border-radius:50%;display:block}
.area{width:100%;height:0;flex:1 1 0;min-height:270px;display:block}
.area.fixed{height:270px;flex:none}
.evofoot{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-top:6px;flex-wrap:wrap}
.evofoot .delta{font-size:26px;font-weight:800;letter-spacing:-.02em}
.evofoot .delta small{font-size:12.5px;font-weight:500;color:var(--ink2);margin-left:6px}
.evofoot p{margin:0;font-size:12.5px;color:var(--ink2);max-width:520px;text-align:right}
.note{font-size:12px;color:var(--warn);font-weight:700;margin-top:10px}
.side{grid-column:5;grid-row:1 / span 3;display:flex;flex-direction:column;gap:18px}
.hl{background:linear-gradient(145deg,#ffe56e,#ffd932 60%,#f5c400);color:var(--accent-ink);border-radius:18px;padding:16px 18px;box-shadow:0 10px 24px rgba(220,160,0,.35)}
.hl .k{font-size:11.5px;font-weight:800;opacity:.8}
.hl .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.hl .s{font-size:12px;opacity:.8;margin-top:2px}
.bars .row{margin-top:11px}
.bars .r1{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600}
.bars .r1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .r1 b{color:var(--ink);font-weight:800;white-space:nowrap}
.bars .bar{height:8px;border-radius:8px;background:var(--pale);margin-top:5px;overflow:hidden}
.bars .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px;transition:width .4s ease}
.bars.alt .bar i{background:linear-gradient(90deg,#ffe98a,#ffd932)}
.chiplite{font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--accent-soft);padding:4px 10px;border-radius:99px;white-space:nowrap}
.rowh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.donutwrap{display:flex;align-items:center;gap:14px;margin-top:10px}
.donutwrap ul{list-style:none;margin:0;padding:0;flex:1}
.donutwrap li{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;color:var(--ink2)}
.donutwrap li b{color:var(--ink);font-weight:800}
.donutwrap li i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.rings{grid-column:4;grid-row:2;display:flex;flex-direction:column}
.rings svg{width:100%;max-width:210px;margin:8px auto 0;display:block}
.rlegend{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--ink2)}
.rlegend div{display:flex;justify-content:space-between;gap:6px}
.rlegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.rlegend b{color:var(--ink)}
.hrs{grid-column:4;grid-row:3}
.hrs .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.hrs .big small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:4px}
.mini{display:flex;align-items:flex-end;gap:10px;height:96px;margin-top:14px}
.mini div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;font-size:11px;color:var(--ink3)}
.mini i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--pale)}
.mini div.cur i{background:linear-gradient(180deg,var(--accent),var(--accent2))}
.mini .mb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;font-size:11px;color:var(--ink3);background:none;border:0;padding:0;cursor:pointer;border-radius:10px}
.mini .mb b{color:var(--ink);font-size:12px}
.mini .mb i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--accent-soft);border:1px solid var(--line2);transition:background .15s}
.mini .mb:hover i{background:var(--accent)}
.mini .mb.on i{background:linear-gradient(180deg,var(--accent),var(--accent2))}
.mini .mb.on span{color:var(--ink);font-weight:800}
.mini .mb[disabled]{cursor:default;opacity:.45}
.mini .mb[disabled]:hover i{background:var(--accent-soft)}
.mini .mb:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
.mini.wide{justify-content:center;gap:clamp(12px,4vw,56px)}
.mini.wide .mb{flex:0 1 240px;font-size:12.5px}
.mini.wide .mb b{font-size:14px}
/* novas telas */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{border-radius:20px;padding:16px 18px;color:var(--accent-ink);box-shadow:var(--shadow);min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.kpi .l{font-size:13px;font-weight:700}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi .s{font-size:12px;opacity:.78;margin-top:2px}
.k1{background:linear-gradient(145deg,#ffe56e,#ffd932 55%,#f5c400)}
.k2{background:linear-gradient(145deg,#fffbe0,#fff1a8);border:1px solid var(--line2)}
.k3{background:linear-gradient(145deg,#ffd24a,#f5b400 70%,#e5a200)}
.k4{background:var(--surface-solid);border:1px solid var(--line2)}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}
.full{margin-bottom:18px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line2);border-radius:99px;padding:4px;gap:2px;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:800;box-shadow:0 4px 10px rgba(200,150,0,.30)}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.ctl label{font-size:13px;font-weight:700;color:var(--ink2)}
select,input[type=search]{background:var(--surface-solid);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;font-size:13px;min-width:200px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:9px 16px;border-radius:99px;cursor:pointer;font-size:13px}
.btn.ghost{background:var(--accent-soft)}
.callout{background:var(--accent-pale);border:1px solid var(--line2);border-left:6px solid var(--accent2);border-radius:14px;padding:12px 16px;font-size:13px;color:var(--ink);margin-bottom:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.callout p{margin:0;max-width:980px;line-height:1.5}
.twrap{overflow:auto;max-height:470px;border-radius:14px;border:1px solid var(--line2);margin-top:12px;background:var(--surface-solid)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--accent-soft);text-align:left;font-weight:800;padding:9px 12px;white-space:nowrap;border-bottom:2px solid var(--accent-ink);z-index:1}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th button{border:0;background:none;font-weight:800;cursor:pointer;padding:0}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--accent-pale)}
tr.sel{background:var(--accent-soft)}
tr[tabindex]{cursor:pointer}
.empty{padding:26px;text-align:center;color:var(--ink2);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--accent-soft)}
.tag.alta{background:#ffd7d0;color:#7a1f12}.tag.media{background:var(--accent);color:var(--accent-ink)}.tag.info{background:var(--pale)}
.prog{height:8px;border-radius:8px;background:var(--pale);min-width:120px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.foot-brand{display:flex;align-items:center;gap:10px;margin:14px 4px 0;font-size:12px;font-weight:600;color:var(--ink2)}
.foot-brand .fb{width:24px;height:24px;flex:none}
.rail .brand-mark{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;margin:2px auto 14px;box-shadow:0 4px 12px rgba(120,90,0,.25)}
.rail .brand-mark .bm{width:34px;height:34px}
.foot-note{margin:22px 4px 0;font-size:12px;color:var(--ink3);line-height:1.6}
@media (max-width:1180px){
  .top{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr)}
  .heroes{grid-column:1 / -1;grid-template-columns:repeat(2,1fr)}
  .evo{grid-column:1 / -1;grid-row:auto}.rings,.hrs{grid-column:auto;grid-row:auto}
  .side{grid-column:1 / -1;grid-row:auto}
  .kpis{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 -4px 18px rgba(150,110,0,.25)}
  .rail .brand-mark{display:none}
  .head-logo{height:34px}
  .nav{flex:1;padding:6px 2px;font-size:10.5px}.nav svg{width:20px;height:20px}
  main{padding:16px 14px 100px}
  .grid,.heroes,.g2,.g3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .rings,.hrs{grid-column:1 / -1;grid-row:auto}
  .evofoot p{text-align:left}
  .evo .bubble{position:static;align-self:flex-start;margin-top:10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* tema azul */
:root{--bg1:#ffffff;--bg2:#ffffff;--bg3:#ffffff;--surface:rgba(255,255,255,.96);
 --ink:#10244a;--ink2:#4b5d7e;--ink3:#8091ad;--line:rgba(16,36,74,.10);--line2:rgba(37,99,235,.22);
 --accent:#2563eb;--accent2:#1d4ed8;--accent-ink:#10244a;--accent-deep:#1d4ed8;--accent-soft:#dbe7fd;--accent-pale:#f1f6ff;--sky:#2563eb;
 --shadow:0 8px 26px rgba(37,99,235,.13);--rail:#1d4ed8;--pale:#e3ebfa;
 --c-and:#2563eb;--c-fin:#38bdf8;--c-per:#10244a;--c-can:#b8c4d9}
.rail{box-shadow:4px 0 22px rgba(29,78,216,.28)}

function finOC(){
  const O = F(D.O), V = F(D.V,-1).filter(r=>!r[6]); const vx = F(D.V,-1).filter(r=>r[6]).length;
  const tot = O.reduce((s,r)=>s+r[3],0), apr = O.filter(r=>r[5]==='apr'), cot = O.filter(r=>r[5]==='cot');
  const aprV = apr.reduce((s,r)=>s+r[3],0), cotV = cot.reduce((s,r)=>s+r[3],0);
  const bySt = topN(O,r=>r[4],r=>r[3],10).map(x => [x[0], x[1], brl(x[1]) + ' · ' + pl(O.filter(r=>r[4]===x[0]).length,'ordem','ordens')]);
  const byCli = topN(O,r=>r[1],r=>r[3],8), byF = topN(O,r=>r[2],r=>r[3],8);
  const em = O.filter(r=>r[6]), nfe = O.filter(r=>r[7]), cp = O.filter(r=>r[8]);
  const perfil = `<div class="bars"><div class="row"><div class="r1"><span>Emergenciais</span><b>${nf(em.length)} · ${brl(em.reduce((s,r)=>s+r[3],0))}</b></div></div>
    <div class="row"><div class="r1"><span>Com NF do fornecedor</span><b>${nf(nfe.length)} de ${nf(O.length)}</b></div></div>
    <div class="row"><div class="r1"><span>Comprovadas</span><b>${nf(cp.length)} de ${nf(O.length)}</b></div></div>
    <div class="row"><div class="r1"><span>Valor médio por ordem</span><b>${O.length?brl(tot/O.length):'—'}</b></div></div></div>`;
  const vm = topN(V,r=>r[0].slice(0,7),r=>r[4],8).sort((a,b)=>a[0].localeCompare(b[0])).map(x=>[mlab(x[0])+'/'+x[0].slice(2,4), x[1], brl(x[1])+' · '+pl(V.filter(r=>r[0].slice(0,7)===x[0]).length,'parcela','parcelas')]);
  return `<div class="kpis">
    ${kpi('k1','Ordens de compra',nf(O.length),'criadas no período')}
    ${kpi('k2','Valor total',brl(tot),'soma de todas as ordens')}
    ${kpi('k3','Aprovado',brl(aprV),tot?pct(aprV/tot*100)+' do valor · '+nf(apr.length)+' ordens':'—')}
    ${kpi('k4','Em cotação',brl(cotV),nf(cot.length)+' ordens')}</div>
  <div class="g2">${card('Valor por status','Situação de cada ordem',bars(bySt, brl))}${card('Valor por cliente','Os 8 com maior valor',bars(byCli, brl, true))}</div>
  <div class="g3">${card('Fornecedores por valor','Os 8 maiores',bars(byF, brl))}${card('Perfil das ordens','Emergenciais, NF e comprovação',perfil)}
    ${card('Parcelas por mês','Vencimentos das ordens, sem as excluídas ('+nf(vx)+' ignoradas). Não depende do período, para incluir parcelas futuras',bars(vm, brl, true))}</div>
  ${card('Lista de ordens de compra','Ordenadas pelo maior valor',`<div class="ctl" style="margin:14px 0 0"><label for="ocnum">Nº da ordem</label><input type="search" id="ocnum" value="${esc(st.ocNum)}" placeholder="Ex.: 28 ou 14, 15" inputmode="numeric" autocomplete="off" style="min-width:150px"><label for="ocq">Palavra-chave</label><input type="search" id="ocq" value="${esc(st.ocQ)}" placeholder="Descrição, cliente, fornecedor, status, valor ou data" autocomplete="off" style="min-width:320px"><button class="btn ghost" id="occlear">Limpar busca</button></div><div id="octable"></div>`)}`;
}
function renderOCTable(){
  const nums = st.ocNum.split(/[\s,;]+/).filter(Boolean);
  const words = norm(st.ocQ).split(/\s+/).filter(Boolean);
  const all = F(D.O).sort((a,b)=>b[3]-a[3]);
  const rows = all.filter(r => (!nums.length || nums.includes(String(r[9]))) && (!words.length || words.every(w => norm([r[9],r[10],r[1],r[2],brl(r[3]),r[4],dbr(r[0])].join(' ')).includes(w))));
  const cols = [{h:'Nº',n:1,f:r=>r[9]},{h:'Descrição',f:r=>r[10]},{h:'Cliente',f:r=>r[1]},{h:'Fornecedor',f:r=>r[2]},{h:'Valor',n:1,f:r=>brl(r[3])},{h:'Status',f:r=>r[4]},{h:'Criada em',f:r=>dbr(r[0])}];
  $('octable').innerHTML = `<div class="ctl" style="margin:12px 0 0"><span class="chiplite">Mostrando ${nf(rows.length)} de ${nf(all.length)} ordens</span></div>` + (rows.length ? table(cols, rows) : '<div class="twrap"><div class="empty">Nenhuma ordem encontrada para essa busca. Confira o número, tente outra palavra ou ative a chave "Dados de teste".</div></div>');
}
function finAP(){
  const A = F(D.AP), I = F(D.API,-1);
  const sum = i => A.reduce((s,r)=>s+r[i],0);
  const byTF = topN(I,r=>r[0],r=>r[2],10).map(x=>[x[0],x[1],pl(x[1],'item','itens')]), byTI = topN(I,r=>r[1],r=>r[2],10).map(x=>[x[0],x[1],pl(x[1],'item','itens')]);
  const cols = [{h:'AP',n:1,f:r=>r[1]},{h:'Título',f:r=>r[2]},{h:'Cliente',f:r=>r[3]},{h:'Competência',f:r=>dbr(r[0])},{h:'Total cliente',n:1,f:r=>brl(r[4])},{h:'Líquido',n:1,f:r=>brl(r[5])},{h:'Honorário',n:1,f:r=>brl(r[6])},{h:'Total OC',n:1,f:r=>brl(r[7])},{h:'Faturado',n:1,f:r=>brl(r[8])},{h:'Recebido',n:1,f:r=>brl(r[9])}];
  return `<div class="kpis">
    ${kpi('k1','APs',nf(A.length),'competência no período')}
    ${kpi('k2','Total ao cliente',brl(sum(4)),'soma das APs')}
    ${kpi('k3','Faturado',brl(sum(8)),sum(4)?pct(sum(8)/sum(4)*100)+' do total':'—')}
    ${kpi('k4','Recebido do cliente',brl(sum(9)),'saldo a receber '+brl(sum(10)))}</div>
  <div class="g2">${card('Itens por tipo de faturamento','Não depende do período',bars(byTF,nf))}${card('Itens por tipo de item','Não depende do período',bars(byTI,nf,true))}</div>
  ${card('Lista de APs','Uma AP por orçamento',table(cols, [...A].sort((a,b)=>b[1]-a[1])))}`;
}
function finORC(){
  const O = F(D.ORC,-1); const sum = f => O.filter(f).reduce((s,r)=>s+r[4],0);
  const stn = ['Aprovado','Criado','Reprovado','Cancelado'];
  const bySt = stn.map(s => [s, sum(r=>r[3]===s), brl(sum(r=>r[3]===s)) + ' · ' + pl(O.filter(r=>r[3]===s).length,'orçamento','orçamentos')]).filter(x=>O.some(r=>r[3]===x[0]));
  const byCli = topN(O,r=>r[2],r=>r[4],8);
  const cols = [{h:'Nº',n:1,f:r=>r[0]},{h:'Título',f:r=>r[1]},{h:'Cliente',f:r=>r[2]},{h:'Projeto',f:r=>r[7]},{h:'Status',f:r=>r[3]},{h:'Itens',n:1,f:r=>nf(r[6])},{h:'Total cliente',n:1,f:r=>brl(r[4])}];
  const ap = O.filter(r=>r[3]==='Aprovado');
  return `<div class="kpis">
    ${kpi('k1','Orçamentos',nf(O.length),'com itens no relatório')}
    ${kpi('k2','Valor total',brl(sum(()=>true)),'soma do total ao cliente')}
    ${kpi('k3','Aprovados',nf(ap.length),brl(sum(r=>r[3]==='Aprovado')))}
    ${kpi('k4','Reprovados e cancelados',nf(O.filter(r=>r[3]==='Reprovado'||r[3]==='Cancelado').length),brl(sum(r=>r[3]==='Reprovado'||r[3]==='Cancelado')))}</div>
  <div class="g2">${card('Valor por status','Soma do total ao cliente',bars(bySt, brl))}${card('Valor por cliente','Os 8 com maior valor',bars(byCli, brl, true))}</div>
  ${card('Orçamentos','Ordenados pelo maior valor · não depende do período',table(cols, [...O].sort((a,b)=>b[4]-a[4]).slice(0,40)))}`;
}
function finRES(){
  const R = F(D.R,-1); const sum = i => R.reduce((s,r)=>s+r[i],0);
  const cols = [{h:'Cliente',f:r=>r[0]},{h:'Projeto',f:r=>r[1]},{h:'Nome',f:r=>r[2]},{h:'Tipo de faturamento',f:r=>r[3]},{h:'Total cliente',n:1,f:r=>brl(r[4])},{h:'Custo',n:1,f:r=>brl(r[5])},{h:'Resultado previsto',n:1,f:r=>brl(r[6])},{h:'Resultado real',n:1,f:r=>brl(r[7])}];
  return `<div class="kpis">
    ${kpi('k1','Linhas',nf(R.length),'projeto × tipo de faturamento')}
    ${kpi('k2','Total ao cliente',brl(sum(4)),'soma')}
    ${kpi('k3','Resultado previsto',brl(sum(6)),'soma')}
    ${kpi('k4','Resultado real',brl(sum(7)),'soma')}</div>
  ${card('Resultado por projeto e tipo de faturamento','Não depende do período',table(cols, R))}`;
}
function fillFin(){
  if ($('octable')) {
    renderOCTable();
    $('ocnum').addEventListener('input', e => { st.ocNum = e.target.value; renderOCTable(); });
    $('ocq').addEventListener('input', e => { st.ocQ = e.target.value; renderOCTable(); });
    $('occlear').addEventListener('click', () => { st.ocNum = ''; st.ocQ = ''; $('ocnum').value = ''; $('ocq').value = ''; renderOCTable(); $('ocnum').focus(); });
  }
  document.querySelectorAll('[data-ft]').forEach(b => b.addEventListener('click', () => { st.finTab = b.dataset.ft; render(); }));
  const t = $('ftest'); if (t) t.addEventListener('click', () => { st.test = !st.test; render(); });
}

/* ===================== ROTEAMENTO E RENDER ===================== */
const FOOT = 'Painel de demonstração com dados fictícios: clientes, pessoas, fornecedores, projetos, valores e datas foram inventados para este projeto de portfólio.';
const VIEWS = {
  geral:{title:'Visão geral', info:'datas-geral', v:viewGeral, f:fillGeral, note:'Datas: projetos e ordens de compra pela data de criação; timesheet pelo mês.', foot:FOOT},
  projetos:{title:'Projetos', info:'datas-projetos', v:viewProjetos, f:fillProjetos, note:'Datas: projetos e jobs pela data de criação. Atividades não têm data e ficam fora do filtro de período.', foot:FOOT},
  timesheet:{title:'Timesheet', info:'datas-timesheet', v:viewTimesheet, f:fillTimesheet, note:'Datas: o timesheet traz um total por mês, com data no último dia de cada mês. O mês entra quando esse dia está no período.', foot:FOOT},
  financeiro:{title:'Financeiro', info:'datas-financeiro', v:viewFin, f:fillFin, note:'Datas: ordens de compra pela criação e APs pela competência. Parcelas, itens de AP, orçamentos e resultado não dependem do período.', foot:FOOT}
};
function renderChrome(){
  $('plabel').textContent = dstr(st.a) + ' — ' + dstr(st.b);
  $('pdays').textContent = '(' + (st.b - st.a + 1) + ' dias)';
  const pa = st.a/SPAN*100, pb = st.b/SPAN*100;
  $('fill').style.left = `calc(10px + (100% - 20px) * ${pa/100})`; $('fill').style.width = `calc((100% - 20px) * ${(pb-pa)/100})`;
  document.querySelectorAll('.chip').forEach(c => { const q = c.dataset.q; const len = q==='all' ? SPAN : +q - 1; c.setAttribute('aria-pressed', String(st.b===SPAN && st.a===Math.max(0, SPAN-len))); });
  document.querySelectorAll('.nav').forEach(n => n.getAttribute('data-v')===st.view ? n.setAttribute('aria-current','page') : n.removeAttribute('aria-current'));
  const V = VIEWS[st.view];
  $('title').innerHTML = 'Painel de Operações<small>' + V.title + '</small>';
  $('datanote').innerHTML = V.note ? esc(V.note) + ib(V.info) : ''; $('datapanel').innerHTML = V.note ? ip(V.info) : ''; $('snappanel').innerHTML = ip('snapshot'); document.querySelectorAll('.snapbtn').forEach(b => b.setAttribute('aria-expanded', String(!!st.infoOpen.snapshot))); $('footnote').textContent = V.foot;
  document.querySelector('.top').style.display = st.view==='dados' ? 'none' : '';
}
function render(){
  const y = window.scrollY; const vw = st.view; renderChrome();
  const V = VIEWS[st.view]; $('view').innerHTML = V.v(); V.f();
  if (vw === st.view) window.scrollTo(0, y);
}
function go(v){ if (!VIEWS[v]) return; st.view = v; try { history.replaceState(null,'','#'+v); } catch(e){} render(); window.scrollTo({top:0}); }
const r1 = $('r1'), r2 = $('r2'); r1.max = r2.max = SPAN; r2.value = SPAN;
$('ticks').innerHTML = [0,1,2,3,4,5,6].map(m => { const pos = (Date.UTC(2026,m,1)-t0)/DAY/SPAN*100; return `<span style="left:${pos}%">${MES[m]}</span>`; }).join('');
function sync(src){ let a = +r1.value, b = +r2.value; if (a > b - 6){ if (src==='a') a = b - 6; else b = a + 6; } a = Math.max(0,a); b = Math.min(SPAN,b); r1.value = a; r2.value = b; st.a = a; st.b = b; render(); }
r1.addEventListener('input', () => sync('a')); r2.addEventListener('input', () => sync('b'));
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { const q = c.dataset.q; const len = q==='all' ? SPAN : +q - 1; st.b = SPAN; st.a = Math.max(0, SPAN-len); r1.value = st.a; r2.value = st.b; render(); }));
document.querySelectorAll('.nav').forEach(n => n.addEventListener('click', e => { e.preventDefault(); go(n.dataset.v); }));
document.addEventListener('click', e => { const t = e.target.closest('.tile'); document.querySelectorAll('.tile.open').forEach(x => { if (x !== t) x.classList.remove('open'); }); if (t && window.matchMedia('(hover: none)').matches) t.classList.toggle('open'); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });
const h0 = (location.hash||'').replace('#',''); if (VIEWS[h0]) st.view = h0;
render();
</script>
